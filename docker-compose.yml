version: '3.8'

services:
  clinic-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic_appointment_manager
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_clinic_appointment_manager_2026_super_secure}
      - JWT_EXPIRES_IN=1d
      - CLIENT_URL=http://localhost:5000
    restart: unless-stopped
